<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI tokenomics across the whole stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0D14; --surf:#121826; --surf2:#18202F; --line:#263044; --text:#EEF2F8; --muted:#8C98AF; --dim:#5B677E;
  --on-acc:#0A0D14; --mix:100%; --glow:.16; --shadow:0 30px 80px rgba(0,0,0,.6);
  --amber:#FFB547;
  --l1:#F472B6; --l2:#E879F9; --l3:#C084FC; --l4:#A78BFA; --l5:#818CF8; --l6:#60A5FA; --l7:#38BDF8;
  --l8:#22D3EE; --l9:#2DD4BF; --l10:#4ADE80; --l11:#FACC15; --l12:#FB923C; --l13:#F87171; --lx:#94A3B8;
  --c: var(--amber);
  --f-head:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid color-mix(in oklab,var(--c) var(--mix),var(--text));outline-offset:3px;border-radius:8px}

/* background glow follows current slide colour */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;transition:background .6s ease}
.glow{background:
  radial-gradient(900px 700px at 85% -10%, color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent), transparent 70%),
  radial-gradient(700px 600px at -5% 105%, color-mix(in srgb,var(--c) calc(var(--glow)*45%),transparent), transparent 70%)}

/* app shell */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:22px clamp(18px,5vw,96px) 8px;font-family:var(--f-mono);font-size:14px;font-weight:700}
.topbar .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.topbar .section{color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.topbar .pagenum{color:var(--muted);white-space:nowrap}
.icon-btn{background:var(--surf2);border:1.5px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:15px}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.navbar{display:flex;align-items:center;gap:12px;padding:12px clamp(18px,5vw,96px) 18px}
.navbar .spacer{flex:1}
.progress{height:6px;background:var(--line);flex:none}
.progress > i{display:block;height:100%;background:var(--c);transition:width .4s ease,background .4s}
@media (max-width:640px){ .topbar .brand{display:none} }

/* accent helpers */
*{--acc:color-mix(in oklab,var(--c) var(--mix),var(--text))}
.acc{color:var(--acc)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;background:var(--surf2);border:1.5px solid var(--line);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;color:var(--text);white-space:nowrap;transition:transform .12s ease,background .2s}
.btn:hover{background:color-mix(in srgb,var(--c) 14%,var(--surf2))}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--c);border-color:var(--c);color:var(--on-acc);font-weight:700}
.btn.solid:hover{background:color-mix(in srgb,var(--c) 85%,white)}
.btn.outline{background:transparent;border-color:var(--c);color:var(--acc)}
.btn.big{min-height:64px;padding:0 30px;font-size:19px}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn.round{width:48px;padding:0;font-family:var(--f-mono);font-size:20px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* slide */
.slide{max-width:1720px;margin:0 auto;padding:18px clamp(18px,5vw,96px) 28px}
.anim-next{animation:inR .45s cubic-bezier(.2,.7,.2,1)}
.anim-prev{animation:inL .45s cubic-bezier(.2,.7,.2,1)}
.anim-up{animation:inU .45s cubic-bezier(.2,.7,.2,1)}
.anim-fade{animation:fade .25s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-up,.anim-fade{animation:none}.glow,.progress>i{transition:none}}

.kicker{font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--acc);margin:0 0 10px}
h1,h2,h3{font-family:var(--f-head);margin:0}
.title{font-size:clamp(30px,3.6vw,58px);font-weight:700;line-height:1.06;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.title.wide{max-width:none}
.sub{color:var(--muted);font-size:clamp(17px,1.5vw,22px);margin:12px 0 0;max-width:70ch}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;margin-bottom:28px}
.layer-head{position:relative}
.ghost{position:absolute;right:0;top:-40px;font-family:var(--f-head);font-weight:700;font-size:clamp(140px,18vw,320px);line-height:1;color:var(--c);opacity:.07;letter-spacing:-.04em;pointer-events:none;z-index:-1}

/* grid */
.g{display:grid;gap:20px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.main-side{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.wide-side{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.stack{display:grid;gap:20px;align-content:start}
@media (max-width:1100px){.c4,.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){.c2,.c3,.main-side,.wide-side{grid-template-columns:1fr}}
@media (max-width:560px){.c4,.c5{grid-template-columns:1fr}}

/* card */
.card{position:relative;background:var(--surf);border:1.5px solid var(--line);border-radius:22px;padding:26px 28px 26px 34px;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.card .tag{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--acc);margin-bottom:14px}
.card .stat{font-family:var(--f-mono);font-weight:700;font-size:clamp(36px,3.4vw,54px);line-height:1.05;color:var(--acc)}
.card .stat.s{font-size:clamp(28px,2.4vw,40px)}
.card .stat-label{color:var(--muted);font-size:15px;margin:8px 0 18px}
.card h3{font-size:clamp(20px,1.6vw,26px);font-weight:600;line-height:1.18;margin-bottom:10px}
.card h3.s{font-size:20px}
.card p{color:var(--muted);margin:0;font-size:16px}
.card p.s{font-size:15px}
.card .cta{margin-top:auto;padding-top:20px}
.card.click{cursor:pointer;transition:border-color .2s,transform .15s}
.card.click:hover{border-color:var(--c)}
.mono{font-family:var(--f-mono)}
.small{font-size:13px;color:var(--dim)}
.muted{color:var(--muted)}

/* levers */
.levers{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.levers b{font-family:var(--f-mono);font-size:14px;color:var(--acc);margin-right:8px}
.chip{border:1.5px solid var(--c);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;background:var(--surf)}

/* bars */
.hbar{display:grid;grid-template-columns:var(--lw,180px) 1fr;align-items:center;gap:14px;margin:10px 0}
.hbar .lbl{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.hbar > span:last-child{min-width:0}
.hbar .track{display:flex;width:100%;align-items:center;gap:12px;min-width:0}
.hbar .fill{height:24px;border-radius:6px;background:var(--c);flex:none}
.hbar .val{font-family:var(--f-mono);font-size:15px;font-weight:700;white-space:nowrap}
.hr{height:1px;background:var(--line);margin:22px 0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* toggle */
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:2px;background:var(--surf2);border:1.5px solid var(--line);border-radius:28px}
.seg button{border:0;background:transparent;border-radius:24px;min-height:44px;padding:0 20px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--on-acc);font-weight:700}

/* app panel */
.panel{background:var(--surf);border:1.5px solid var(--line);border-radius:24px;overflow:hidden}
.panel .bar{display:flex;align-items:center;gap:8px;padding:0 20px;height:50px;background:var(--surf2);font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.panel .bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.panel .body{padding:28px}
.metric{background:var(--surf2);border-radius:18px;padding:22px 24px}
.metric .k{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.metric .v{font-family:var(--f-mono);font-size:clamp(38px,4vw,60px);font-weight:700;line-height:1.1;margin:10px 0 8px}
.metric .d{font-size:15px;color:var(--muted)}
.insight{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:16px;padding:20px 22px;margin-top:24px}
.insight .k{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.insight p{margin:0;font-size:18px}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.55);display:grid;place-items:center;padding:20px;animation:fade .2s ease-out}
.scrim[hidden]{display:none}
.modal{--c:var(--amber);position:relative;width:min(1100px,100%);max-height:min(88vh,900px);overflow:auto;background:var(--surf);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:28px;box-shadow:var(--shadow);padding:44px 48px 40px;animation:pop .25s cubic-bezier(.2,.7,.2,1)}
.modal::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal,.scrim{animation:none}}
.modal .tag{font-family:var(--f-mono);font-weight:700;color:var(--acc);font-size:15px;margin-bottom:10px}
.modal h2{font-size:clamp(26px,2.6vw,40px);line-height:1.1;letter-spacing:-.01em;max-width:28ch;margin-bottom:26px}
.modal .close{position:absolute;right:24px;top:24px;width:44px;height:44px;border-radius:50%;background:var(--surf2);border:1.5px solid var(--line);cursor:pointer;font-size:18px}
.modal ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.modal li{position:relative;padding-left:26px;font-size:clamp(16px,1.3vw,20px)}
.modal li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--c)}
.modal .foot{margin-top:28px}
@media (max-width:640px){.modal{padding:36px 22px 28px}}
.drow{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:16px 20px;border-radius:12px}
.drow:nth-child(odd){background:var(--surf2)}
.drow b{font-family:var(--f-mono);color:var(--acc);font-size:15px}
@media (max-width:640px){.drow{grid-template-columns:1fr;gap:6px}}

/* tooltip */
.tip{position:fixed;z-index:40;width:min(400px,90vw);background:var(--surf);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;pointer-events:none;animation:fade .15s ease-out}
.tip[hidden]{display:none}
.tip .tag{font-family:var(--f-mono);font-weight:700;color:var(--acc);font-size:14px}
.tip h4{font-family:var(--f-head);font-size:26px;margin:6px 0 10px}
.tip p{margin:0;color:var(--muted);font-size:15px}

/* specific: cover stack */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;min-height:calc(100vh - 220px)}
.cover h1{font-size:clamp(64px,9.5vw,160px);line-height:.95;letter-spacing:-.04em;font-weight:700;margin:6px 0 28px}
.cover .lede{font-size:clamp(19px,1.8vw,28px);color:var(--muted);max-width:30ch;margin:0 0 36px}
.mini-stack{display:grid;gap:10px}
.mini-stack button{--i:0;display:flex;align-items:center;gap:16px;height:44px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);margin-left:calc(var(--i)*7px);margin-right:calc(var(--i)*7px);padding:0 18px;font-size:17px;font-weight:500;cursor:pointer;text-align:left}
.mini-stack button:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.mini-stack .n{font-family:var(--f-mono);font-weight:700;color:var(--acc);font-size:15px;width:24px}
@media (max-width:960px){.cover{grid-template-columns:1fr;min-height:0}}

/* thesis bars */
.swing{display:grid;gap:30px;margin-top:10px}
.swing button{all:unset;cursor:pointer;display:block;border-radius:14px;padding:6px 4px}
.swing button:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.swing .row-h{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.swing h3{font-size:clamp(20px,1.8vw,28px);font-weight:600}
.swing .note{color:var(--muted);font-size:16px;margin:4px 0 12px}
.swing .track{position:relative;height:28px;background:var(--surf2);border-radius:14px}
.swing .fill{position:absolute;top:0;bottom:0;border-radius:14px;background:var(--c)}
.swing .val{position:absolute;top:50%;transform:translate(14px,-50%);font-family:var(--f-mono);font-weight:700;font-size:clamp(20px,2vw,30px);color:var(--acc);white-space:nowrap}
.axis{position:relative;height:30px;margin-top:6px}
.axis span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:13px;color:var(--dim);padding-top:14px}
.axis span::before{content:"";position:absolute;left:50%;top:0;width:1px;height:10px;background:var(--dim)}
.quote{border-left:4px solid var(--c);padding-left:24px;font-size:clamp(18px,1.6vw,24px);max-width:38ch}

/* equation */
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:14px 14px}
.eq .op{font-family:var(--f-mono);font-size:40px;font-weight:300;color:var(--muted)}
.term{border:2px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:18px;padding:18px 22px;text-align:left;cursor:pointer;min-width:200px}
.term:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.term .t{display:block;font-family:var(--f-mono);font-size:clamp(17px,1.5vw,22px);font-weight:700}
.term .s{display:block;font-family:var(--f-mono);font-size:14px;color:var(--acc);margin-top:10px}
.fraction{height:3px;background:var(--amber);margin:22px 0;border-radius:2px}
.selfhost{border-left:4px solid var(--l10);padding-left:20px;font-family:var(--f-mono);font-size:17px}

/* hub */
.hub{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px}
@media (max-width:1100px){.hub{grid-template-columns:1fr}}
.bands{display:grid;gap:7px}
.band{--i:0;display:grid;grid-template-columns:44px minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;gap:14px;min-height:52px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);margin-left:calc(var(--i)*5px);margin-right:calc(var(--i)*5px);padding:6px 18px 6px 22px;position:relative;overflow:hidden;cursor:pointer;text-align:left}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.band:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.band .n{font-family:var(--f-mono);font-weight:700;color:var(--acc)}
.band .nm{font-family:var(--f-head);font-weight:600;font-size:19px}
.band .d{color:var(--muted);font-size:15px}
.band .s{font-family:var(--f-mono);font-size:14px;color:var(--acc);text-align:right}
@media (max-width:760px){.band{grid-template-columns:34px 1fr;margin-left:0;margin-right:0}.band .d,.band .s{grid-column:2;text-align:left}}
.edge{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--dim);margin:6px 0}
.jumps{display:grid;gap:12px}
.jumps .btn{justify-content:space-between;border-radius:14px;min-height:56px;border-color:var(--c)}

/* misc charts */
.bars30{display:flex;align-items:flex-end;gap:4px;height:270px}
.bars30 i{flex:1;max-width:14px;border-radius:3px 3px 0 0;background:var(--c);position:relative}
.bars30 i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:var(--text);opacity:.85;border-radius:2px}
.ui-mini{background:var(--surf2);border-radius:14px;padding:16px;height:270px;display:flex;flex-direction:column;gap:12px}
.bubble{height:30px;border-radius:10px;background:var(--line)}
.bubble.me{align-self:flex-end;background:color-mix(in srgb,var(--c) 60%,transparent)}
.fld{height:30px;border-radius:8px;background:var(--bg);border:1.5px solid var(--line)}
.fld-l{width:80px;height:10px;border-radius:3px;background:var(--dim)}
.jv{display:flex;align-items:flex-end;gap:16px;height:170px;border-bottom:1px solid var(--line);padding:0 6px}
.jv div{display:flex;align-items:flex-end;gap:6px;flex:1}
.jv i{flex:1;border-radius:4px}
.node{background:var(--surf2);border:1.5px solid var(--c);border-radius:14px;padding:12px 18px}
.node b{display:block;font-family:var(--f-head);font-size:19px}
.node span{font-family:var(--f-mono);font-size:13px;color:var(--acc)}
.mscale{position:relative;height:250px;min-width:880px;margin:0 20px}
.mscale .line{position:absolute;left:0;right:0;top:120px;height:6px;border-radius:3px;background:var(--line)}
.mscale .tick{position:absolute;top:116px;width:2px;height:16px;background:var(--dim)}
.mscale .tl{position:absolute;top:140px;transform:translateX(-50%);font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.mscale .mk{position:absolute;top:114px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--c);border:3px solid var(--surf)}
.mscale .ml{position:absolute;width:170px;margin-left:-85px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--acc);line-height:1.3}
.mscale .stem{position:absolute;width:1.5px;margin-left:-.75px;background:var(--c);opacity:.6}
.gpu{cursor:help;padding:24px}
.gpu::before{display:none}
.chipi{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);display:grid;place-items:center;flex:none}
.chipi i{width:22px;height:22px;border-radius:4px;background:var(--c);opacity:.75}
.meter{height:12px;border-radius:6px;background:var(--surf2);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;border-radius:6px}
.stackbar{display:flex;gap:4px;height:64px}
.stackbar i{border-radius:8px}
.gauge{display:flex;gap:6px;height:80px}
.gauge i{flex:1;border-radius:5px;background:var(--surf2)}
.formula{font-family:var(--f-mono);font-weight:700;font-size:clamp(15px,1.4vw,21px);line-height:1.6}
.col{border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:var(--surf);border-radius:22px;padding:26px 28px}
.col .tag{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--acc)}
.col h3{font-size:26px;margin:6px 0 18px}
.blist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.blist li{position:relative;padding-left:24px;font-size:16px}
.blist li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--c)}
table{border-collapse:separate;border-spacing:0 4px;width:100%}
th{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surf2)}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
td{padding:9px 14px;font-size:14px;background:var(--surf);vertical-align:top}
tr.link{cursor:pointer}
tr.link:hover td{background:color-mix(in srgb,var(--c) 10%,var(--surf))}
tr.link td:first-child{border-left:4px solid var(--c);border-radius:8px 0 0 8px}
tr.link td:last-child{border-radius:0 8px 8px 0}
.dash{display:grid;grid-template-columns:220px minmax(0,1fr)}
.dash nav{background:color-mix(in srgb,var(--bg) 50%,transparent);padding:20px 12px;display:grid;gap:6px;align-content:start}
.dash nav span{padding:10px 18px;border-radius:10px;color:var(--muted);font-size:15px}
.dash nav span.on{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--acc);font-weight:600}
@media (max-width:900px){.dash{grid-template-columns:1fr}.dash nav{display:none}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surf2);border-radius:14px;padding:16px 18px}
.kpi .k{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:32px;font-weight:700;color:var(--acc)}
.kpi .d{font-size:13px;color:var(--dim)}
.log td{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.close-hero{font-size:clamp(54px,8vw,124px);line-height:1;letter-spacing:-.04em;font-weight:700;margin:12px 0 30px}
.sources{columns:2 320px;column-gap:40px;padding:0;margin:0;list-style:none}
.sources li{break-inside:avoid;padding:6px 0;font-size:15px}
.cav{display:grid;grid-template-columns:72px 1fr;gap:16px;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:12px}
.cav b{font-family:var(--f-mono);color:var(--amber)}
.split{display:grid;grid-template-columns:var(--cols);gap:28px}
@media (max-width:960px){.split{grid-template-columns:1fr}}
@media (max-width:560px){.lvl:not(.key){display:none}}

/* slow glow on interactive elements */
.btn,.term,.band,.mini-stack button,.card.click,.gpu,.seg,.chip,.swing .fill{--glowc:color-mix(in srgb,var(--c) 55%,#ffffff)}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--glowc) 18%,transparent),0 0 0 0 transparent}
  50%{box-shadow:0 0 0 2px var(--glowc),0 0 18px 3px color-mix(in srgb,var(--glowc) 75%,transparent)}}
@keyframes breatheF{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 2px var(--glowc)) drop-shadow(0 0 12px color-mix(in srgb,var(--glowc) 80%,transparent))}}
.btn:not([disabled]),.term,.band,.mini-stack button,.card.click,.gpu,.seg,.chip{animation:breathe 2.8s ease-in-out infinite}
.swing .fill{animation:breatheF 2.8s ease-in-out infinite}
.btn:not([disabled]):hover,.term:hover,.band:hover,.mini-stack button:hover,.card.click:hover,.gpu:hover,.chip:hover,.seg:hover{animation:none;box-shadow:0 0 0 2px var(--glowc),0 0 24px 4px color-mix(in srgb,var(--glowc) 70%,transparent)}
@media (prefers-reduced-motion:reduce){
  .btn:not([disabled]),.term,.band,.mini-stack button,.card.click,.gpu,.seg,.chip,.swing .fill{animation:none;box-shadow:0 0 0 1.5px var(--glowc),0 0 10px 1px color-mix(in srgb,var(--glowc) 45%,transparent)}
  .swing .fill{box-shadow:none;filter:drop-shadow(0 0 2px var(--glowc))}}
.modal.narrow{width:min(780px,100%)}
.about-p{font-size:clamp(17px,1.5vw,21px);margin:0;line-height:1.5}
#aboutBtn svg{display:block}
.navbar .btn:not([disabled]),.navbar .btn:not([disabled]):hover{animation:none;box-shadow:none}
.li{margin-left:auto;display:inline-block;width:1.45em;height:1.45em;flex:none;border-radius:3px;line-height:0;transition:transform .15s,box-shadow .2s}
.li img{display:block;width:100%;height:100%}
.li.gh + .li{margin-left:-6px}
.li:hover{transform:translateY(-1px);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.45)}
.chip{cursor:help}

/* hover descriptions */
.hint{position:fixed;z-index:45;max-width:min(320px,86vw);background:#1E2738;color:var(--text);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 14px 40px rgba(0,0,0,.55);pointer-events:none;animation:fade .15s ease-out}
.hint[hidden]{display:none}
.hint b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--acc);margin-bottom:3px}
.gloss{border-bottom:1.5px dotted color-mix(in srgb,var(--c) 75%,transparent);cursor:help}
.gloss:hover,.gloss:focus-visible{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
(() => {
const L = n => `var(--l${n})`;
const A = 'var(--amber)';
const esc = s => s;

/* ---------- building blocks ---------- */
const card = o => `<div class="card${o.go?' click':''}" style="--c:${o.c}" ${o.go?`data-go="${o.go}" role="button" tabindex="0"`:''}>
  ${o.tag?`<div class="tag">${o.tag}</div>`:''}
  ${o.stat?`<div class="stat${o.ss?' s':''}">${o.stat}</div>`:''}
  ${o.sl?`<div class="stat-label">${o.sl}</div>`:''}
  ${o.title?`<h3 class="${o.ts?'s':''}">${o.title}</h3>`:''}
  ${o.body?`<p class="${o.bs?'s':''}">${o.body}</p>`:''}
  ${o.html||''}
  ${o.ov?`<div class="cta"><button class="btn outline sm" data-ov="${o.ov}">${o.cta||'Deep dive ↗'}</button></div>`:''}
  ${o.ctaGo?`<div class="cta"><button class="btn outline sm" data-go="${o.ctaGo}">${o.cta}</button></div>`:''}
</div>`;
const levers = (c, items, extra='') => `<div class="levers" style="--c:${c}"><b>Levers</b>${items.map(t=>`<span class="chip" tabindex="0">${t}</span>`).join('')}${extra}</div>`;
const lhead = (n, title) => `<div class="head layer-head"><h1 class="title wide">${title}</h1><span class="ghost" aria-hidden="true">${String(n).padStart(2,'0')}</span></div>`;
const hbar = (label, v, max, txt, o={}) => `<div class="hbar" style="--lw:${o.lw||'180px'};${o.c?`--c:${o.c}`:''}"><span class="lbl">${label}</span><span class="track"><span class="fill" style="width:calc((100% - 150px) * ${Math.max(v/max,0.015)});${o.op?`opacity:${o.op}`:''}"></span><span class="val">${txt}</span></span></div>`;
const seg = (group, opts, cur) => `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${group}:${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;
const panel = (title, body) => `<div class="panel"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span style="margin-left:10px">${title}</span></div><div class="body">${body}</div></div>`;
const blist = (items, c) => `<ul class="blist" style="--c:${c}">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;

/* ---------- state ---------- */
const state = { L5:'upfront', L9:'arch', effort:'medium', util:'idle' };

/* ---------- slides ---------- */
const LAYERS = ['Front end / UX','Application & business model','Orchestration / agent loop','Context & memory','Prompt layer','Tool layer','Gateway / routing','Provider API pricing','Model architecture & reasoning','Serving engines','Hardware','Datacenter & energy','On-prem vs cloud API'];

const S = [];
const add = (id, section, c, render) => S.push({ id, section, c, render });

add('cover','Briefing · November 2026',A, () => `
<div class="cover">
  <div>
    <p class="kicker">AI tokenomics across the whole stack</p>
    <h1>The bill isn’t the price.</h1>
    <p class="lede">What actually determines tokens, cost per token and cost per successful task — from the front end down to the metal.</p>
    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <button class="btn solid big" data-go="thesis">Start the briefing</button>
      <button class="btn big" data-go="stack-map">Jump to the stack map</button>
    </div>
  </div>
  <div>
    <div class="edge">↑ Front end</div>
    <div class="mini-stack">${LAYERS.map((n,i)=>`<button style="--c:${L(i+1)};--i:${i}" data-go="layer-${i+1}"><span class="n">${String(i+1).padStart(2,'0')}</span>${n}</button>`).join('')}</div>
    <div class="edge" style="margin-left:90px">↓ Metal</div>
  </div>
</div>`);

add('thesis','The thesis',A, () => {
  const lg = v => Math.log10(v)/2*100;
  const rows = [['Agent loops, reasoning effort, context growth','Same task, different token volume','5–100×',5,100,L(3),'layer-3'],
    ['GPU utilisation on identical H100s','$0.21 → $15.25 per M output tokens','up to 36×',2.5,36.3,L(10),'utilisation-explorer'],
    ['Vendor list-price differences','What procurement usually negotiates','2–5×',2,5,L(8),'layer-8']];
  return `<div class="head"><div><p class="kicker">Where cost actually swings</p><h1 class="title">Volume and utilisation dwarf vendor price differences.</h1></div>
  <p class="quote">Treat cost per successful task — not price per million tokens — as the unit of account at every layer.</p></div>
  <p class="muted" style="font-size:19px;margin:0 0 20px">Swing in cost for the same task (log scale). Select a bar to see the layer that causes it.</p>
  <div class="swing">${rows.map(([t,n,v,lo,hi,c,go])=>`<button style="--c:${c}" data-go="${go}"><span class="row-h"><h3>${t}</h3><span class="mono acc" style="font-size:14px;font-weight:700">Explore</span></span><p class="note">${n}</p>
    <span class="track" style="display:block;margin-right:140px"><span class="fill" style="left:${lg(lo)}%;width:${lg(hi)-lg(lo)}%"></span><span class="val" style="left:${lg(hi)}%">${v}</span></span></button>`).join('')}
  </div>
  <div class="axis" style="margin-right:140px">${[1,2,5,10,20,50,100].map(v=>`<span style="left:${lg(v)}%">${v}×</span>`).join('')}</div>`;
});

add('tldr','TL;DR',A, () => `<div class="head"><div><p class="kicker">Three things to remember</p><h1 class="title wide">If you only take away three slides, take these.</h1></div></div>
<div class="g c3">
${card({c:L(3),tag:'T-01',stat:'4× · 15×',sl:'tokens of a chat interaction for agents · multi-agent systems',title:'Volume beats rate.',body:'“Max” reasoning effort burned ~7× the output tokens and ~5.6× cost per task of “medium” — at an identical per-token price.',ov:'T01'})}
${card({c:L(8),tag:'T-02',stat:'+30%',sl:'more tokens for the same text with the Claude 4.7+ tokenizer',title:'Price per token isn’t comparable.',body:'Tokenizers, languages (1.2–7× tax), media, caching, batch, residency and speed tiers all reshape the effective rate.',ov:'T02'})}
${card({c:L(10),tag:'T-03',stat:'$0.21–$15.25',sl:'per M output tokens on the same H100, depending only on load',title:'On-prem is a utilisation problem.',body:'Architecture and engine features set the ceiling. Self-host only for sustained, predictable, high-volume or regulated load.',ov:'T03'})}
</div>`);

add('equation','K-01 · The core equation',A, () => {
  const t = (k,l,s,c) => `<button class="term" style="--c:${c}" data-ov="eq-${k}"><span class="t">${l}</span><span class="s">${s} ↗</span></button>`;
  const op = s => `<span class="op" aria-hidden="true">${s}</span>`;
